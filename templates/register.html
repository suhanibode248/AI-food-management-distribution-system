<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodShare - Register</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .login-card {
            width: 100%;
            max-width: 500px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            filter: drop-shadow(0 0 20px var(--primary-glow));
            animation: float-icon 4s ease-in-out infinite;
        }

        @keyframes float-icon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        .role-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .role-option input[type="radio"]:checked + .role-label {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-2px);
        }

        .role-icon {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .role-text {
            font-weight: 600;
            font-size: 0.85rem;
            color: #fff;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="glass-panel login-card animate-fade-up">
            <div class="login-header">
                <span class="login-icon">✨</span>
                <h1 class="text-gradient mb-1">Create Account</h1>
                <p style="color: var(--text-muted)">Join FoodShare today</p>
            </div>

            <!-- Flash Messages Toasts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                <div class="toast-container" style="position: static; margin-bottom: 1rem;">
                  {% for category, message in messages %}
                    <div class="toast {{ category }}" style="animation: none; margin-bottom: 0;">
                        <div class="toast-message">{{ message }}</div>
                    </div>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form action="/register" method="POST">
                <div class="form-group flex gap-2" style="flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required>
                    </div>
                    <div style="flex: 1; min-width: 200px;">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" name="phone" placeholder="Contact number" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                </div>

                <div class="form-group">
                    <label>Select Your Role</label>
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="role" value="admin" required>
                            <div class="role-label">
                                <span class="role-icon">🏨</span>
                                <span class="role-text">Donor</span>
                            </div>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="ngo">
                            <div class="role-label">
                                <span class="role-icon">❤️</span>
                                <span class="role-text">NGO</span>
                            </div>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="driver">
                            <div class="role-label">
                                <span class="role-icon">🚚</span>
                                <span class="role-text">Driver</span>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary submit-btn">Sign Up</button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
                <p style="color: var(--text-muted)">Already have an account? <a href="/login" style="color: var(--primary); text-decoration: none; font-weight: bold;">Login here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
